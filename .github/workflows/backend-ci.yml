name: Backend CI

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      
      - name: Build backend
        run: mvn clean package -DskipTests
      
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/*.jar
  docker-test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: target

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/marathon-backend:latest .
          
      - name: Run Docker container
      
        run: |
          docker run -d -p 8080:8080 --name backend-test ${{ secrets.DOCKER_USERNAME }}/marathon-backend:latest
          sleep 10
          
      - name: Show containers

        run: docker ps -a

      - name: Show backend logs
        run: docker logs backend-test

      - name: Test API endpoint
        run: curl http://localhost:8080/api/marathons

      
  docker-publish:
    needs: docker-test
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: target

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/marathon-backend:latest .

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/marathon-backend:latest
